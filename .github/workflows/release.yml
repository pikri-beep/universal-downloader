name: Release Universal Media Downloader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build Frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: desktop/backend/requirements.txt

      - name: Install Python Dependencies & Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Download Static FFmpeg Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/bin
          $zipUrl = "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/autobuild-2024-05-31-14-11/ffmpeg-N-115715-g8787090887-win64-gpl.zip"
          $zipPath = "desktop/bin/ffmpeg.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "desktop/bin/temp" -Force
          Get-ChildItem -Path "desktop/bin/temp" -Recurse -Filter "ffmpeg.exe" | Copy-Item -Destination "desktop/bin/ffmpeg.exe"
          Get-ChildItem -Path "desktop/bin/temp" -Recurse -Filter "ffprobe.exe" | Copy-Item -Destination "desktop/bin/ffprobe.exe"
          Remove-Item -Recurse -Force "desktop/bin/temp", $zipPath

      - name: Package with PyInstaller
        working-directory: desktop
        run: |
          pyinstaller universal_downloader.spec --clean --noconfirm

      - name: Bundle FFmpeg into Distribution Folder
        shell: pwsh
        run: |
          Copy-Item "desktop/bin/ffmpeg.exe" -Destination "desktop/dist/UniversalDownloader/" -Force
          Copy-Item "desktop/bin/ffprobe.exe" -Destination "desktop/dist/UniversalDownloader/" -Force

      - name: Create Release Zip
        run: |
          python -m zipfile -c desktop/dist/UniversalDownloader-Windows.zip desktop/dist/UniversalDownloader

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Windows
          path: desktop/dist/UniversalDownloader-Windows.zip

  build-mobile-android:
    name: Build Android Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        working-directory: mobile
        run: chmod +x gradlew

      - name: Build Android APKs
        working-directory: mobile
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect & Rename APKs
        run: |
          mkdir -p release-apks
          cp mobile/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/UniversalDownloader-arm64.apk
          cp mobile/app/build/outputs/apk/debug/app-universal-debug.apk release-apks/UniversalDownloader-universal.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Android-APKs
          path: release-apks/*.apk

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-desktop-windows, build-mobile-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: UniversalDownloader-Windows
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: UniversalDownloader-Android-APKs
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
